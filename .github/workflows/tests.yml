name: Tests
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Abhängigkeiten (ohne KI)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install "numpy<2" opencv-python-headless
      - name: Rauchtest Foto (ohne KI-Modelle)
        run: python tests/test_synthetic.py
      - name: Rauchtest Video (ohne KI)
        run: python tests/test_video.py --no-ki
