name: Tests
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Abhängigkeiten (ohne KI)
        run: pip install "numpy<2" opencv-python-headless
      - name: Rauchtest ohne KI-Modelle
        run: python tests/test_synthetic.py
